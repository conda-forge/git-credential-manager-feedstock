{% set name = "git-credential-manager" %}
{% set version = "3.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/GitCredentialManager/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: fb51d6c47996c624e95b4ee08fddac8bc7da2b45233b085ce1bd534719017ece
  patches:
    - 0001-use_conda_cc_env.patch  # [linux]
    # The script needs PowerShell 7, but this environment only provides an older version.
    - 0002-pwsh_5_compat.patch  # [win]

build:
  number: 0

requirements:
  build:
    - {{ compiler('c') }}  # [linux]
    - {{ stdlib("c") }}  # [linux]
    - dotnet =10.0.100
  host:
    - fontconfig  # [linux]
    - zlib  # [aarch64]

test:
  requires:
    - git
  commands:
    - git credential-manager --version

about:
  home: https://github.com/GitCredentialManager/git-credential-manager
  summary: Secure, cross-platform Git credential storage
  description: |
    Secure, cross-platform Git credential storage with authentication to
    GitHub, Azure Repos, and other popular Git hosting services.
  license: MIT
  license_file:
    - LICENSE
    - NOTICE

extra:
  recipe-maintainers:
    - dhirschfeld
    - sshockwave
